# Offline / no-Supabase development. Activate with:
#   SPRING_PROFILES_ACTIVE=local
# or: mvn spring-boot:run -Dspring-boot.run.profiles=local
# Data is in-memory and discarded when the process stops. Tables will NOT appear in Supabase.

spring.datasource.url=jdbc:h2:mem:apispy;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
