spring.application.name=api-spy
server.port=8080

# Adaptive practice is separate from the 1 → 3 → 5 API-device escalation.
apispy.adaptive.incorrect-attempt-threshold=2
apispy.adaptive.max-practice-doors-per-room=2

# Database — Supabase PostgreSQL (or any Postgres). Never put these in frontend env files.
# Required for the default profile. Prefer username/password as separate env vars
# (do not embed the password in the JDBC URL). See backend/.env.example for pooler values.
# Load via: .\run-with-env.ps1   or set DATABASE_* in your shell.
# For offline H2 only: spring.profiles.active=local
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=public
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.default-schema=public

# Session cookie (Lax for local Vite proxy; use None+Secure on Render later via profile)
server.servlet.session.cookie.name=APISPYSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APISPY_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${APISPY_COOKIE_SAME_SITE:Lax}
server.servlet.session.timeout=12h

# Auth / mail
apispy.auth.max-failed-attempts-per-minute=20
apispy.mail.enabled=${APISPY_MAIL_ENABLED:false}
apispy.cors.allowed-origins=${APISPY_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
