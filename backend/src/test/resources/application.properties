spring.application.name=api-spy-test

spring.datasource.url=jdbc:h2:mem:apispy-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.servlet.session.cookie.name=APISPYSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=Lax

apispy.adaptive.incorrect-attempt-threshold=2
apispy.adaptive.max-practice-doors-per-room=2
apispy.auth.max-attempts=1000
apispy.auth.window-minutes=15
apispy.rate-limit.max-requests-per-minute=10000
apispy.mail.enabled=false
apispy.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
# Isolated mission tests do not seed prior Recruit clears; dedicated progression tests re-enable this.
apispy.career.sequential-unlock=false
